[project]
name = "matrix"
version = "0.1.0"
description = "Project Matrix — 个人智能协作网络，通用 Agent 底座"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "jsonschema>=4.18,<5",
    "rfc3339-validator>=0.1.4,<1",
    "rfc3986-validator>=0.1.1,<1",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "networkx>=3.0",
]
mcp = [
    "mcp>=1.27.0,<2.0",
]
browser = [
    "playwright>=1.40.0",
    "mcp>=1.27.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27,<0.29",
    "httpx2>=2.0.0",
]

[project.scripts]
matrix = "matrix.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 注意：当前没有测试带 integration marker，`-m 'not integration'` 实际是空操作；
# 后续补 live case 时需先打 marker，否则该过滤形同不存在。
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: optional tests requiring external services or heavyweight dependencies",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
